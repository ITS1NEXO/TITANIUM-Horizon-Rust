name: Build TITANIUM .hmod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and package
        run: python scripts/package_hmod.py
      - name: Upload .hmod artifact
        uses: actions/upload-artifact@v4
        with:
          name: TITANIUM-hmod
          path: dist/*.hmod
          if-no-files-found: error
          retention-days: 14
